name: MLflow tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "dev/clint/**"
      - "mlflow/server/js/**"
      - ".github/workflows/js.yml"
      - ".claude/**"
  push:
    branches:
      - master
      - branch-[0-9]+.[0-9]+
      - main
      - rhoai-*

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Use `bash` by default for all `run` steps in this workflow:
# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#defaultsrun
defaults:
  run:
    shell: bash

env:
  MLFLOW_HOME: ${{ github.workspace }}
  # Note miniconda is pre-installed in the virtual environments for GitHub Actions:
  # https://github.com/actions/virtual-environments/blob/main/images/linux/scripts/installers/miniconda.sh
  MLFLOW_CONDA_HOME: /usr/share/miniconda
  SPARK_LOCAL_IP: localhost
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements/constraints.txt
  PYTHONUTF8: "1"
  _MLFLOW_TESTING_TELEMETRY: "true"
  MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
  MLFLOW_KONFLUX_IMAGE: mlflow-konflux:ci
  MLFLOW_KONFLUX_IMAGE_ARTIFACT: mlflow-konflux-ci-image

permissions: {}

jobs:
  build-konflux-image:
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false || github.event.pull_request.user.login == 'Copilot' && github.event.pull_request.user.type == 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/free-disk-space
      - name: Build Konflux image
        run: docker build -f Dockerfile.konflux -t "$MLFLOW_KONFLUX_IMAGE" .
      - name: Save Konflux image
        run: |
          mkdir -p konflux-image
          docker save -o "konflux-image/${MLFLOW_KONFLUX_IMAGE_ARTIFACT}.tar" "$MLFLOW_KONFLUX_IMAGE"
      - name: Upload Konflux image
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.MLFLOW_KONFLUX_IMAGE_ARTIFACT }}
          path: konflux-image/${{ env.MLFLOW_KONFLUX_IMAGE_ARTIFACT }}.tar
          retention-days: 1
          if-no-files-found: error

  python:
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false || github.event.pull_request.user.login == 'Copilot' && github.event.pull_request.user.type == 'Bot')
    needs: [build-konflux-image]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
        splits: [4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/untracked
      - uses: ./.github/actions/cache-hf
      - name: Download Konflux image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.MLFLOW_KONFLUX_IMAGE_ARTIFACT }}
          path: ${{ runner.temp }}/konflux-image
      - name: Load Konflux image
        run: docker load -i "$RUNNER_TEMP/konflux-image/${MLFLOW_KONFLUX_IMAGE_ARTIFACT}.tar"
      - name: Run tests
        env:
          SPLITS: ${{ matrix.splits }}
          GROUP: ${{ matrix.group }}
        run: |
          mkdir -p "$HOME/.cache/huggingface"
          docker run --rm --init --user 0 --shm-size=2g \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$HOME/.cache/huggingface:/root/.cache/huggingface" \
            -w "$GITHUB_WORKSPACE" \
            -e HOME=/root \
            -e CI \
            -e MLFLOW_HOME="$GITHUB_WORKSPACE" \
            -e PYTHONUTF8 \
            -e _MLFLOW_TESTING_TELEMETRY \
            -e MLFLOW_SERVER_ENABLE_JOB_EXECUTION \
            -e SPARK_LOCAL_IP \
            -e SPLITS \
            -e GROUP \
            -e HF_HOME=/root/.cache/huggingface \
            --entrypoint /bin/bash \
            "$MLFLOW_KONFLUX_IMAGE" \
            "$GITHUB_WORKSPACE/dev/run_konflux_python_ci.sh"

  database:
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false || github.event.pull_request.user.login == 'Copilot' && github.event.pull_request.user.type == 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/untracked
      - name: Build
        run: |
          ./tests/db/compose.sh pull -q postgresql mysql mssql
          docker images --digests
          ./tests/db/compose.sh build --build-arg DEPENDENCIES="$(python dev/extract_deps.py)"
      - name: Run tests
        run: |
          set +e
          err=0
          trap 'err=1' ERR
          RESULTS=""
          for service in $(./tests/db/compose.sh config --services | grep '^mlflow-' | sort)
          do
            # Set `--no-TTY` to show container logs on GitHub Actions:
            # https://github.com/actions/virtual-environments/issues/5022
            ./tests/db/compose.sh run --rm --no-TTY $service pytest \
              tests/store/tracking/sqlalchemy_store \
              tests/store/tracking/test_gateway_sql_store.py \
              tests/store/model_registry/test_sqlalchemy_store.py \
              tests/store/model_registry/test_sqlalchemy_workspace_store.py \
              tests/store/workspace/test_sqlalchemy_store.py \
              tests/db
              RESULTS="$RESULTS\n$service: $(if [ $? -eq 0 ]; then echo "✅"; else echo "❌"; fi)"
          done

          echo -e "$RESULTS"
          test $err = 0

      - name: Run migration check
        run: |
          set +e
          err=0
          trap 'err=1' ERR

          ./tests/db/compose.sh down --volumes --remove-orphans
          for service in $(./tests/db/compose.sh config --services | grep '^migration-')
          do
            ./tests/db/compose.sh run --rm --no-TTY $service
          done

          test $err = 0

      - name: Clean up
        run: |
          ./tests/db/compose.sh down --volumes --remove-orphans --rmi all

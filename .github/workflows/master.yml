name: MLflow tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "dev/clint/**"
      - "mlflow/server/js/**"
      - ".github/workflows/js.yml"
      - ".claude/**"
  push:
    branches:
      - master
      - branch-[0-9]+.[0-9]+
      - main
      - rhoai-*

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Use `bash` by default for all `run` steps in this workflow:
# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#defaultsrun
defaults:
  run:
    shell: bash

env:
  MLFLOW_HOME: ${{ github.workspace }}
  # Note miniconda is pre-installed in the virtual environments for GitHub Actions:
  # https://github.com/actions/virtual-environments/blob/main/images/linux/scripts/installers/miniconda.sh
  MLFLOW_CONDA_HOME: /usr/share/miniconda
  SPARK_LOCAL_IP: localhost
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements/constraints.txt
  PYTHONUTF8: "1"
  _MLFLOW_TESTING_TELEMETRY: "true"
  MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"

permissions: {}

jobs:
  python:
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false || github.event.pull_request.user.login == 'Copilot' && github.event.pull_request.user.type == 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    # AIPCC wheels are built for UBI9 and link RHEL sonames
    # (libopenblasp.so.0, libtiff.so.5). Ubuntu cannot provide those.
    container:
      image: registry.access.redhat.com/ubi9/ubi:9.7
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
        include:
          - splits: 4
    steps:
      - name: Install CI bootstrap packages
        run: |
          # git/tar: checkout and actions. gcc/make/libpq-devel: konflux-pypi
          # pins psycopg2 as an sdist; Dockerfile.konflux wheels it in the
          # image build. openssh: SFTP artifact-repo tests. Not image RPMs.
          dnf install -y --setopt=install_weak_deps=0 --setopt=tsflags=nodocs \
            dnf-plugins-core \
            git tar gzip findutils which procps-ng gcc make \
            libpq-devel \
            openssh-server openssh-clients
          dnf config-manager --set-enabled crb \
            || dnf config-manager --set-enabled codeready-builder-for-rhel-9-x86_64-rpms \
            || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
      - name: Mark repository as git safe directory
        run: git config --global --add safe.directory "$(pwd)"
      - name: Install Konflux runtime RPMs
        run: |
          # Same OS packages as Dockerfile.konflux (ubi.repo only).
          dnf install -y --setopt=install_weak_deps=0 --setopt=tsflags=nodocs \
            $(grep -vE '^[[:space:]]*(#|$)' requirements/konflux-runtime-rpms.txt)
      - uses: ./.github/actions/untracked
      - uses: ./.github/actions/setup-python
        id: setup-python
        with:
          python-version: "3.12"
          pin-micro-version: "false"
      - uses: ./.github/actions/setup-java
      - name: Install dependencies
        env:
          PYTHON_VERSION: ${{ steps.setup-python.outputs.python-version }}
        run: |
          uv sync --python "$PYTHON_VERSION" --extra extras --extra gateway --extra mcp --extra genai
          uv pip install \
            -r requirements/test-requirements.txt

      - name: Overlay Konflux-pinned dependencies
        run: |
          # Konflux pins are curated and may fall outside the rolling-window
          # exclusion policy set by setup-python. Unset rather than empty:
          # UV_EXCLUDE_NEWER= is treated as an invalid date by uv.
          # --no-config ignores pyproject.toml constraint-dependencies
          # (e.g. xgboost<3.1.0), which break --require-hashes.
          # --python .venv/bin/python is required in the job container: uv
          # otherwise honors .python-version (3.10) instead of the 3.12 venv.
          unset UV_EXCLUDE_NEWER
          unset PIP_CONSTRAINT
          export UV_LINK_MODE=copy
          uv --no-config pip install --python .venv/bin/python --no-cache-dir --require-hashes --no-deps \
            -r requirements/konflux-aipcc-requirements.txt

          uv --no-config pip install --python .venv/bin/python --no-cache-dir --require-hashes --no-deps \
            -r requirements/konflux-pypi-requirements.txt

          # test-requirements.txt pulls opentelemetry-exporter-otlp-proto-{grpc,http}
          # unpinned, resolving newer than the AIPCC-pinned opentelemetry-sdk==1.41.1
          # and breaking OTLPSpanExporter imports. These exporters are test-only
          # (lazy, optional at runtime) and are not shipped in Dockerfile.konflux, so
          # pin them here in CI rather than in the autogenerated Konflux lock files.
          uv --no-config pip install --python .venv/bin/python --no-cache-dir --no-deps \
            "opentelemetry-exporter-otlp-proto-common==1.41.1" \
            "opentelemetry-exporter-otlp-proto-grpc==1.41.1" \
            "opentelemetry-exporter-otlp-proto-http==1.41.1"

      - uses: ./.github/actions/show-versions
      - uses: ./.github/actions/cache-hf
      - name: Import check
        run: |
          # `-I` is used to avoid importing modules from user-specific site-packages
          # that might conflict with the built-in modules (e.g. `types`).
          uv run --python .venv/bin/python --no-sync python -I tests/check_mlflow_lazily_imports_ml_packages.py
          # Native wheels whose sonames are in ubi.repo. sklearn is omitted:
          # sklearn 1.8 imports pyarrow, which needs libthrift (not in UBI).
          uv run --python .venv/bin/python --no-sync python -I -c "import numpy, pandas, PIL, matplotlib"
      - name: Run tests
        env:
          SPLITS: ${{ matrix.splits }}
          GROUP: ${{ matrix.group }}
          # Skip extra-ml / pyarrow collection (tests/conftest.py). Option 2
          # dropped extra-ml-requirements.txt and does not install libthrift.
          MLFLOW_KONFLUX_PINNED_TESTS: "1"
        run: |
          # UBI containers do not ship ~/.ssh; ssh-keygen will not create it.
          mkdir -p ~/.ssh
          # Start sshd for the SFTP artifact-repo tests; the UBI base image does
          # not run it. Guarded so a restart is a no-op if it is already up.
          if ! pgrep -x sshd >/dev/null; then
            ssh-keygen -A
            mkdir -p /var/run/sshd /run/sshd
            /usr/sbin/sshd
          fi
          source dev/setup-ssh.sh
          # --python: overlay used 3.12; .python-version is 3.10 and uv would warn.
          uv run --python .venv/bin/python --no-sync pytest --splits=$SPLITS --group=$GROUP \
            --quiet --requires-ssh --ignore-flavors \
            --ignore=tests/examples \
            --ignore=tests/evaluate \
            --ignore=tests/optuna \
            --ignore=tests/pyspark/optuna \
            --ignore=tests/genai \
            --ignore=tests/docker \
            --ignore=tests/sagemaker \
            --ignore=tests/projects/test_projects.py \
            --ignore=tests/projects/test_virtualenv_projects.py \
            --ignore=tests/projects/test_docker_projects.py \
            --ignore=tests/projects/test_projects_cli.py \
            --ignore=tests/metrics/test_metric_definitions.py \
            tests

  database:
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false || github.event.pull_request.user.login == 'Copilot' && github.event.pull_request.user.type == 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/untracked
      - name: Build
        run: |
          ./tests/db/compose.sh pull -q postgresql mysql mssql
          docker images --digests
          ./tests/db/compose.sh build --build-arg DEPENDENCIES="$(python dev/extract_deps.py)"
      - name: Run tests
        run: |
          set +e
          err=0
          trap 'err=1' ERR
          RESULTS=""
          for service in $(./tests/db/compose.sh config --services | grep '^mlflow-' | sort)
          do
            # Set `--no-TTY` to show container logs on GitHub Actions:
            # https://github.com/actions/virtual-environments/issues/5022
            ./tests/db/compose.sh run --rm --no-TTY $service pytest \
              tests/store/tracking/sqlalchemy_store \
              tests/store/tracking/test_gateway_sql_store.py \
              tests/store/model_registry/test_sqlalchemy_store.py \
              tests/store/model_registry/test_sqlalchemy_workspace_store.py \
              tests/store/workspace/test_sqlalchemy_store.py \
              tests/db
              RESULTS="$RESULTS\n$service: $(if [ $? -eq 0 ]; then echo "✅"; else echo "❌"; fi)"
          done

          echo -e "$RESULTS"
          test $err = 0

      - name: Run migration check
        run: |
          set +e
          err=0
          trap 'err=1' ERR

          ./tests/db/compose.sh down --volumes --remove-orphans
          for service in $(./tests/db/compose.sh config --services | grep '^migration-')
          do
            ./tests/db/compose.sh run --rm --no-TTY $service
          done

          test $err = 0

      - name: Clean up
        run: |
          ./tests/db/compose.sh down --volumes --remove-orphans --rmi all
